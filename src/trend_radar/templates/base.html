<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Merak Radarı{% endblock %}</title>
<meta name="description" content="Türkiye dün Vikipedi'de neyi birden merak etti? Her sabah otomatik güncellenen sıçrama listesi.">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="Türkiye dün Vikipedi'de neyi birden merak etti?">
<meta property="og:type" content="website">
<meta name="theme-color" content="#e11d48">
<link rel="icon" href="{{ root }}favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ root }}style.css?v={{ asset_version }}">
<link rel="alternate" type="application/rss+xml" title="Merak Radarı" href="{{ root }}feed.xml">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ root or './' }}">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".3"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".6"/><circle cx="16" cy="16" r="3.5" fill="currentColor"/><path d="M16 16 L27 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    <span>merak radarı</span>
  </a>
  <nav class="site-nav">
    <a href="{{ root }}arsiv.html">Arşiv</a>
    <a href="{{ root }}nasil.html">Nasıl çalışır?</a>
    <a href="{{ repo_url }}">GitHub</a>
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="site-footer">
  <p>Görüntülenme verileri <a href="https://doc.wikimedia.org/generated-data-platform/aqs/analytics-api/">Wikimedia Analytics API</a> (CC0), madde özetleri <a href="https://tr.wikipedia.org">Vikipedi</a> (CC BY-SA 4.0).</p>
  <p>Her sabah GitHub Actions ile kendiliğinden güncellenir · <a href="{{ repo_url }}">Kaynak kod</a> · <a href="{{ root }}feed.xml">RSS</a> · <a href="{{ root }}api/latest.json">JSON</a> · Ege Çelik</p>
</footer>
</body>
</html>
